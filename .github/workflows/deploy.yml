name: Deploy to Hetzner

on:
  push:
    branches:
      - claude/clone-b5-web-repo-uhsd04
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run export

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz --delete dist/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/big5.rd-sim.de/html/"

      - name: Deploy invite.htpasswd (outside the public web root)
        run: |
          printf '%s\n' '${{ secrets.INVITE_HTPASSWD_LINE }}' > /tmp/invite.htpasswd
          chmod 644 /tmp/invite.htpasswd
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "mkdir -p /var/www/big5.rd-sim.de/secrets"
          rsync -avz /tmp/invite.htpasswd "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/big5.rd-sim.de/secrets/invite.htpasswd"

      - name: Deploy invite-api backend service
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "mkdir -p /var/www/big5.rd-sim.de/invite-api"
          rsync -avz --delete --exclude node_modules server/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/big5.rd-sim.de/invite-api/"
          {
            echo "PORT=4001"
            printf 'SMTP_HOST=%s\n' '${{ secrets.SMTP_HOST }}'
            printf 'SMTP_PORT=%s\n' '${{ secrets.SMTP_PORT }}'
            printf 'SMTP_USER=%s\n' '${{ secrets.SMTP_USER }}'
            printf 'SMTP_PASSWORD=%s\n' '${{ secrets.SMTP_PASSWORD }}'
            printf 'MAIL_FROM_ADDRESS=%s\n' '${{ secrets.MAIL_FROM_ADDRESS }}'
            echo "MAIL_FROM_NAME=Big Five Test | rd-sim.de"
          } > /tmp/invite-api.env
          chmod 600 /tmp/invite-api.env
          rsync -avz /tmp/invite-api.env "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/big5.rd-sim.de/invite-api/.env"
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "export XDG_RUNTIME_DIR=/run/user/\$(id -u) && cd /var/www/big5.rd-sim.de/invite-api && npm ci --omit=dev && systemctl --user restart big5-invite-api"
